<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Explore - Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <nav>
        <h1>✈ Travel Explore</h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="table.html">Packages</a></li>
            <li><a href="form.html">Booking</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button id="themeToggle">🌙</button>
    </nav>
</header>

<main class="container">
    <h2 class="section-title">Contact Us</h2>

    <form class="booking-form">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

        <button type="submit" class="book-btn">Send Message</button>
    </form>
</main>

<footer>
    <p><strong>ICT Project – Artificial Intelligence (Sem 1)</strong></p>
    <p><strong>Group Members:</strong> Qandeel Zahra | Zara Babar | Umama Khan</p>
    <p>Institute of Space and Technology, Islamabad</p>
    <p>© 2026 Travel Explore</p>
</footer>

<script>
const themeToggle = document.getElementById("themeToggle");
themeToggle.onclick = () => {
    document.body.classList.toggle("dark");
    themeToggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
};

const form = document.querySelector(".booking-form");
form.addEventListener("submit", e => {
    e.preventDefault();
    alert("Message sent successfully!");
    form.reset();
});
</script>
